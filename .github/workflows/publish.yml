name: Publish npm package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.repository == 'coderevivehq/selectize.js'
    runs-on: ubuntu-latest

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Set up npm trusted publishing
        run: npm install --global npm@11

      - name: Verify the release
        shell: bash
        run: |
          package_name="$(node --print "require('./package.json').name")"
          package_version="$(node --print "require('./package.json').version")"
          release_version="${GITHUB_REF_NAME#v}"

          if [ "$package_name" != "@coderevivehq/selectize" ]; then
            echo "Unexpected package name: $package_name"
            exit 1
          fi

          if [ "$package_version" != "$release_version" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match package version $package_version."
            exit 1
          fi

          git fetch origin master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Verify generated files
        run: git diff --exit-code

      - name: Run tests
        run: npm test

      - name: Check npm
        id: npm-version
        shell: bash
        run: |
          package_name="$(node --print "require('./package.json').name")"
          package_version="$(node --print "require('./package.json').version")"

          if npm view "$package_name@$package_version" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$package_name@$package_version is already published."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.npm-version.outputs.published != 'true'
        run: npm publish
